spring.application.name=auth_server
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://eureka:eureka2026@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# OAuth2 client GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub

# Auhtorization Server propio
spring.security.oauth2.authorizationserver.issuer=http://localhost:8080

# JWT propio
ms.auth.jwt.issuer=http://localhost:8080
ms.auth.jwt.expiration-seconds=36000

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG

# Autenticacion
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/.well-known/jwks.json